<html>
  <head>
    <title>Phones</title>
    <!--JQuery CDN-->
    <script
      src="https://code.jquery.com/jquery-4.0.0.js"
      integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
      crossorigin="anonymous"
    ></script>

    <link rel = "stylesheet" href = "style.css">

    <style type = "text/css">
      #phone-page {
        width: 100%;
        margin: auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      

      #phone-showcase{
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        
      }
      
      
    </style>
  </head>

  <body>
    <!-- ===== nav bar ===== -->
      <header class="site-header">
      <div class="container">
        <!-- logo links to the home page -->
        <a href="index.html" class="logo"><strong>Electronics <span>Store</span></strong></a>

        <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="phones.html" class = "active">Phones</a></li>
          <li><a href="tablets.html">Tablets</a></li>
          <li><a href="laptops.html">Laptops</a></li>
          <li><a href="repairs.html">Repairs</a></li>
          <li><a href="bookARepar.html">Book a repair</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
        </nav>
      </div>
    </header>


    <!-- Phone page container-->
    <div id="phone-page" class="card-container">

      <!-- Intro section with filter buttons -->
      <div class="header">
        <h1>PHONES</h1>
        <p>
          Powerful cameras, all-day batteries, and reliable connectivity in
          every model
        </p>
        <img src = "images/phones.jpg ">
      </div>

      <hr>

      <div class="filter-group">
          <h2>Explore the Range</h2>
          <h3>Compare our lates phone modes and </h3>

          <button class="filter-btn">All</button>
          <button class="filter-btn">Apple</button>
          <button class="filter-btn">Samsung</button>
          <button class="filter-btn">Google</button>
      </div>
      
     <hr>

      <!-- container with phone cards -->
      <div id="phone-showcase"></div>

      <!-- event handling for buttons-->
      <script>
        window.onload = function () {

          // separates all phones into categories
          allPhones = [];
          apple = [];
          google = [];
          samsung = [];
          
          // function to display each phone's card
          function displayCard(brand) {
            str = "";
            brand.forEach(function (phone) {
              str +=
                "<div class = 'product-card'>" +
                "<img src = '" + phone.image + "' width = '100%'>"
                + "<div class = 'card-content'>" 
                + "<h2>" + phone.name + "</h2>"
                + "<h3>" + "Price: $" + phone.price + "</h3>"
                + "<p>" + phone.specs + "</p>" 
                + "</div>" +
                "</div>";
            });

            document.getElementById("phone-showcase").innerHTML = str;
          }

          $.get("products.json", function (phones) {
            allPhones = phones.phones;

            // each phone is pushed to its corresponding categories w/o
            allPhones.forEach(function (phone) {

              if (phone.brand == "Apple") {
                apple.push(phone);
              } else if (phone.brand == "Samsung") {
                samsung.push(phone);
              } else if (phone.brand == "Google") {
                google.push(phone);
              }
            });

            // display all phones by default
            displayCard(allPhones)
          });


          // adding event listeners to filter buttons
          filterBtn = document.querySelectorAll(".filter-btn");
          filterBtn.forEach(function (button) {

            button.addEventListener("click", function () {
              // get seletected brand 
              selectedBrand = this.innerText;

              // display the phones
              if (selectedBrand == "All") {
                displayCard(allPhones);
              } else if (selectedBrand == "Apple") {
                displayCard(apple);
              } else if (selectedBrand == "Google") {
                displayCard(google);
              } else if (selectedBrand == "Samsung") {
                displayCard(samsung);
              }
            });
          });
        };
      </script>
    </div>
  </body>
</html>
